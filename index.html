<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我们都.是.gay</title>
<meta name="description" content="我们都.是.gay — 站点建设中">
<!-- 内联 SVG 图标，避免额外请求和 favicon 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ec7'/%3E%3Cstop offset='.5' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2367e8f9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230d0d16'/%3E%3Ccircle cx='50' cy='50' r='24' fill='none' stroke='url(%23g)' stroke-width='9'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0a11;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --fg:#ececf4;
    --dim:#9a9ab0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(60rem 40rem at 15% -10%, rgba(255,110,199,.18), transparent 60%),
      radial-gradient(55rem 38rem at 90% 110%, rgba(103,232,249,.16), transparent 60%),
      radial-gradient(40rem 30rem at 60% 40%, rgba(167,139,250,.10), transparent 65%),
      var(--bg);
    color:var(--fg);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .card{
    position:relative;
    width:100%;
    max-width:620px;
    padding:44px 40px 38px;
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--card);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 90px -40px rgba(0,0,0,.9);
    overflow:hidden;
    text-align:center;
  }
  /* 顶部一道很细的彩虹线，只为 .gay 这个域名点题 */
  .card::before{
    content:"";
    position:absolute;
    inset:0 0 auto;
    height:3px;
    background:linear-gradient(90deg,#ff6ec7,#f9a8d4,#a78bfa,#67e8f9);
    opacity:.85;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 13px;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--dim);
    font-size:13px;
    letter-spacing:.02em;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 0 0 rgba(74,222,128,.6);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}
    70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}
    100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
  }
  h1{
    margin:22px 0 6px;
    font-size:clamp(26px,6vw,40px);
    line-height:1.25;
    font-weight:700;
    letter-spacing:-.01em;
    background:linear-gradient(100deg,#ffd9f0,#e9d5ff 45%,#cffafe);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{margin:0 0 22px;color:var(--dim);font-size:15px}
  .rule{
    width:64px;height:1px;margin:0 auto 24px;
    background:linear-gradient(90deg,transparent,var(--line),transparent);
  }
  .big{
    margin:0 0 10px;
    font-size:clamp(20px,4.6vw,26px);
    font-weight:600;
    letter-spacing:.04em;
  }
  .en{margin:0;color:var(--dim);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
  .host{
    display:inline-block;
    margin-top:26px;
    padding:9px 15px;
    border:1px dashed var(--line);
    border-radius:12px;
    color:var(--dim);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    word-break:break-all;
  }
  footer{margin-top:26px;color:#6f6f85;font-size:12.5px}
  a{color:#c9b6ff;text-decoration:none;border-bottom:1px solid rgba(201,182,255,.35)}
  a:hover{border-bottom-color:#c9b6ff}
  @media (max-width:480px){
    .card{padding:34px 22px 30px;border-radius:18px}
  }
  @media (prefers-reduced-motion:reduce){
    .dot{animation:none}
  }
</style>
</head>
<body>
  <main class="card">
    <span class="pill"><span class="dot" aria-hidden="true"></span>占位页已上线</span>

    <h1>我们都.是.gay</h1>
    <p class="sub">域名解析已就位，站点正在搭建</p>

    <div class="rule" aria-hidden="true"></div>

    <p class="big">建设中</p>
    <p class="en">Under construction</p>

    <p class="host">xn--vnqp08bwj8a.xn--0iv.gay</p>

    <footer>换了内容，这个页面就该退休了 · <span id="y">2026</span></footer>
  </main>

  <script>
    // 只做一件事：年份别写死
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
