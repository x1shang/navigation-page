<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>从无序到有序 · 排序可视化</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--card:#121d2b;--muted:#91a2ba;--line:#27354a;--blue:#75aaff;--green:#60d5ae;--yellow:#ffce73;--pink:#f18ab6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#192b42 0,transparent 48%),var(--bg);color:#edf3fc;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:40px 32px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:var(--green);letter-spacing:3px;font-size:11px;font-weight:700}h1{font-size:34px;margin:7px 0;font-weight:650;letter-spacing:-1px}header p{color:var(--muted);margin:0}.badge{border:1px solid var(--line);padding:7px 13px;border-radius:30px;color:var(--muted);white-space:nowrap}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 17px;padding:17px;background:#152131bb;border:1px solid var(--line);border-radius:14px}button,select{font:inherit;color:inherit;border:1px solid #35465e;border-radius:8px;background:#1d2d42;padding:9px 14px;cursor:pointer}button:hover{background:#2c415d}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:4px}.primary{background:var(--green);border-color:var(--green);color:#10281f;min-width:112px;font-weight:700}.primary:hover{background:#88e6c5}label{display:flex;align-items:center;gap:9px;color:var(--muted)}.spacer{flex:1}input{accent-color:var(--green);width:116px}output{min-width:38px;color:#edf3fc}.legend{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:20px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:linear-gradient(135deg,#152132,#111b29);border:1px solid var(--line);border-radius:15px;overflow:hidden}.card-top{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}.card h2{font-size:18px;margin:0}.english{color:var(--muted);font-size:10px;letter-spacing:1.5px;margin-top:2px}.complexity{color:var(--green);font-family:monospace;font-size:12px}.idea{padding:10px 20px 0;color:var(--muted);font-size:12px;min-height:48px}svg{display:block;width:100%;height:auto;overflow:visible}.bar{transition:transform var(--duration,180ms) ease-in-out,fill 100ms;fill:var(--blue)}.bar.compare{fill:var(--yellow)}.bar.move{fill:var(--pink)}.bar.sorted{fill:var(--green)}.chart-label{font-size:9px;fill:#72869f;letter-spacing:1px}.baseline{stroke:#2b3d55;stroke-width:1}.status{padding:0 20px;min-height:42px;font-size:12px;color:#c9d7e9}.stats{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:20px;color:var(--muted);font-size:11px}.stats b{font-size:14px;color:#edf3fc;font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}.track{height:3px;background:#223046}.progress{height:100%;width:0;background:var(--green);transition:width .15s}.foot{color:var(--muted);font-size:12px;margin-top:20px}.overall{margin-left:auto;color:var(--green)}.grid.focus{grid-template-columns:minmax(0,900px);justify-content:center}.hidden{display:none}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){main{padding:24px 16px}h1{font-size:28px}.grid{grid-template-columns:1fr}header .badge{display:none}.spacer{display:none}.controls{gap:10px}.legend{gap:12px}}
</style>
<link rel="icon" type="image/x-icon" href="../绪山真寻的本体.ico">
</head>
<body><main>
<header><div><div class="eyebrow">ALGORITHM PLAYGROUND / 排序实验室</div><h1>从无序，到有序。</h1><p>跟随每一根柱子的移动，看六种算法如何把噪音排列成阶梯。</p></div><span class="badge">6 种算法 · 同一组起点</span></header>
<section class="controls" aria-label="播放控制">
<button class="primary" id="play">▶ 开始排序</button><button id="step">单步 →</button><button id="reset">↺ 重播本组</button><button id="shuffle">⤨ 换一组数据</button>
<span class="spacer"></span><label>柱子<select id="count"><option>12</option><option selected>24</option><option>40</option><option>64</option></select></label>
<label>速度<input id="speed" type="range" min="1" max="10" value="5"><output id="speedText">5 档</output></label>
<label>视图<select id="view"><option value="all">六种对比</option><option value="0">冒泡排序</option><option value="1">选择排序</option><option value="2">插入排序</option><option value="3">归并排序</option><option value="4">快速排序</option><option value="5">堆排序</option></select></label>
</section>
<div class="legend"><span><i class="dot" style="background:var(--blue)"></i>待排序</span><span><i class="dot" style="background:var(--yellow)"></i>正在比较 / 基准</span><span><i class="dot" style="background:var(--pink)"></i>正在移动</span><span><i class="dot" style="background:var(--green)"></i>已到最终位置</span><span class="overall" id="overall" aria-live="polite">准备就绪</span></div>
<div class="grid" id="grid"></div>
<p class="foot">每一步展示一次比较、移动或位置确认；各算法同时推进一个演示步骤，动画时长不代表实际运行耗时。下方暂存区展示插入排序的待插入元素和归并排序的辅助数组。柱子越高，数值越大。</p>
</main>
<script>
const definitions=[
 ['冒泡排序','BUBBLE SORT','O(n²)','相邻两柱比较交换，让较大的柱子逐轮移到右端。'],
 ['选择排序','SELECTION SORT','O(n²)','扫描未排序区域，每轮把最小的柱子放到左端。'],
 ['插入排序','INSERTION SORT','O(n²)','取出一根柱子，将左侧较大的柱子右移，再插入空位。'],
 ['归并排序','MERGE SORT','O(n log n)','把相邻有序段合并进暂存区，再按顺序写回。'],
 ['快速排序','QUICK SORT','平均 O(n log n)','选择右端柱子作基准，分区后递归排列左右两边。'],
 ['堆排序','HEAP SORT','O(n log n)','建立最大堆，把堆顶最大值移到末端，再调整剩余堆。']
];
function buildTrace(kind,input){
 let a=input.slice(),aux=Array(a.length).fill(null),fixed=new Set(),frames=[],comparisons=0,moves=0;
 const emit=(message,active=[],type='compare')=>frames.push({a:a.slice(),aux:aux.slice(),fixed:[...fixed],active:active.filter(x=>x!==null),type,message,comparisons,moves});
 const compare=(x,y,message)=>{comparisons++;emit(message,[x,y]);};
 const swap=(i,j,message)=>{if(i===j)return;const ids=[a[i],a[j]];[a[i],a[j]]=[a[j],a[i]];moves+=2;emit(message,ids,'move');};
 emit('随机柱形图已就绪，点击开始观察。',[]);
 if(kind===0){for(let end=a.length-1;end>0;end--){let changed=false;for(let j=0;j<end;j++){compare(a[j],a[j+1],'比较相邻两柱，较大者向右移动。');if(a[j]>a[j+1]){swap(j,j+1,'交换相邻两柱。');changed=true;}}fixed.add(a[end]);emit('本轮最大值已到达右端。',[]);if(!changed)break;}}
 if(kind===1){for(let i=0;i<a.length-1;i++){let min=i;for(let j=i+1;j<a.length;j++){compare(a[min],a[j],'寻找剩余柱子中最矮的一根。');if(a[j]<a[min]){min=j;emit('更新当前找到的最小值。',[a[min]]);}}swap(i,min,'将最小值交换到未排序区域的最左端。');fixed.add(a[i]);emit('左端的一根柱子已到最终位置。',[]);}}
 if(kind===2){for(let i=1;i<a.length;i++){const key=a[i];aux[i]=key;a[i]=null;moves++;emit('取出待插入的柱子，放入暂存区。',[key],'move');let j=i-1;while(j>=0){compare(a[j],key,'与左侧有序区域比较，寻找插入位置。');if(a[j]<=key)break;const id=a[j];a[j+1]=id;a[j]=null;moves++;emit('较大的柱子右移一格，留出空位。',[id],'move');j--;}a[j+1]=key;aux[i]=null;moves++;emit('把暂存的柱子插入空位，左侧恢复有序。',[key],'move');}}
 if(kind===3){for(let width=1;width<a.length;width*=2){for(let left=0;left<a.length;left+=2*width){const mid=Math.min(left+width,a.length),right=Math.min(left+2*width,a.length);if(mid===right)continue;let i=left,j=mid,k=left;while(i<mid||j<right){let take;if(i<mid&&j<right){compare(a[i],a[j],'比较两个有序段的首个未取出元素。');take=a[i]<=a[j]?i++:j++;}else take=i<mid?i++:j++;const id=a[take];aux[k++]=id;a[take]=null;moves++;emit('把较小的柱子依次放入下方辅助数组。',[id],'move');}for(let t=left;t<right;t++){const id=aux[t];a[t]=id;aux[t]=null;moves++;emit('将合并后的有序段从辅助数组写回。',[id],'move');}}}}
 if(kind===4){function quick(lo,hi){if(lo>hi)return;if(lo===hi){fixed.add(a[lo]);emit('单元素分区已到最终位置。',[]);return;}const pivot=a[hi];emit('选择当前分区最右端的柱子作为基准。',[pivot]);let p=lo;for(let j=lo;j<hi;j++){compare(a[j],pivot,'与基准比较：较小值放到分区左侧。');if(a[j]<pivot){swap(p,j,'将小于基准的柱子交换到左侧。');p++;}}swap(p,hi,'将基准交换到左右分区之间。');fixed.add(pivot);emit('基准已到最终位置，继续处理左右两区。',[]);quick(lo,p-1);quick(p+1,hi);}quick(0,a.length-1);}
 if(kind===5){function sift(root,size){while(true){let largest=root,l=2*root+1,r=l+1;if(l<size){compare(a[largest],a[l],'比较堆中的父节点与左子节点。');if(a[l]>a[largest])largest=l;}if(r<size){compare(a[largest],a[r],'比较当前最大节点与右子节点。');if(a[r]>a[largest])largest=r;}if(largest===root)break;swap(root,largest,'较大子节点上移，恢复最大堆。');root=largest;}}for(let i=Math.floor(a.length/2)-1;i>=0;i--)sift(i,a.length);emit('最大堆建立完成，最左端是当前最大值。',[]);for(let end=a.length-1;end>0;end--){swap(0,end,'把堆顶最大值交换到未排序区域的末端。');fixed.add(a[end]);emit('末端最大值已固定，重新调整剩余堆。',[]);sift(0,end);}}
 fixed=new Set(a);emit('排序完成：左侧最矮，右侧最高。',[]);return frames;
}
const $=id=>document.getElementById(id);let input=[],panels=[],running=false,lastTime=0;
const interval=()=>[0,1000,700,480,320,220,150,100,65,40,20][+$('speed').value];
function createPanel(index){const d=definitions[index],el=document.createElement('article');el.className='card';el.innerHTML=`<div class="card-top"><div><h2>${d[0]}</h2><div class="english">${d[1]}</div></div><span class="complexity">${d[2]}</span></div><div class="idea">${d[3]}</div><svg viewBox="0 0 440 275" role="img" aria-label="${d[0]}柱形动画"><text x="20" y="18" class="chart-label">主数组 · 从小到大 →</text><line x1="20" y1="179" x2="420" y2="179" class="baseline"/><text x="20" y="205" class="chart-label">暂存区</text><line x1="20" y1="259" x2="420" y2="259" class="baseline"/><g class="bars"></g></svg><div class="status"></div><div class="stats"><span>比较<b class="comparisons">0</b></span><span>移动<b class="moves">0</b></span><span>步骤<b class="steps">0</b></span></div><div class="track"><div class="progress"></div></div>`;
 $('grid').append(el);const group=el.querySelector('.bars'),bars=new Map(),w=400/input.length;
 for(const id of input){const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('width',Math.max(2,w-3));rect.setAttribute('height',140*id/input.length);rect.setAttribute('rx','2');rect.classList.add('bar');const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=`数值 ${id}`;rect.append(title);group.append(rect);bars.set(id,rect);}
 return {el,bars,frames:buildTrace(index,input),cursor:0};}
function render(p){const f=p.frames[p.cursor],fixed=new Set(f.fixed),active=new Set(f.active),w=400/input.length;for(const [row,base,scale] of [[f.a,179,1],[f.aux,259,.29]]){row.forEach((id,i)=>{if(id===null)return;const b=p.bars.get(id),h=140*id/input.length;b.style.transform=`translate(${20+i*w}px,${base-h*scale}px) scale(1,${scale})`;b.setAttribute('class','bar'+(fixed.has(id)?' sorted':active.has(id)?' '+f.type:''));});}p.el.querySelector('.status').textContent=f.message;p.el.querySelector('.comparisons').textContent=f.comparisons;p.el.querySelector('.moves').textContent=f.moves;p.el.querySelector('.steps').textContent=`${p.cursor} / ${p.frames.length-1}`;p.el.querySelector('.progress').style.width=`${100*p.cursor/(p.frames.length-1)}%`;}
function selected(){return panels.filter((p,i)=>$('view').value==='all'||i===+$('view').value);}
function updateStatus(){const ps=selected(),done=ps.filter(p=>p.cursor===p.frames.length-1).length;$('overall').textContent=done===ps.length?'全部完成 ✓':`${done} / ${ps.length} 完成`;$('play').textContent=running?'❚❚ 暂停':done===ps.length?'↺ 再看一次':'▶ 继续 / 开始';}
function pause(){running=false;updateStatus();}
function advance(){let advanced=false;for(const p of selected()){if(p.cursor<p.frames.length-1){p.cursor++;render(p);advanced=true;}}if(!advanced||selected().every(p=>p.cursor===p.frames.length-1))running=false;updateStatus();}
function rebuild(randomize){running=false;if(randomize){input=Array.from({length:+$('count').value},(_,i)=>i+1);for(let i=input.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[input[i],input[j]]=[input[j],input[i]];}}$('grid').innerHTML='';panels=definitions.map((_,i)=>createPanel(i));panels.forEach(render);applyView();$('overall').textContent='准备就绪';$('play').textContent='▶ 开始排序';}
function applyView(){panels.forEach((p,i)=>p.el.classList.toggle('hidden',$('view').value!=='all'&&i!==+$('view').value));$('grid').classList.toggle('focus',$('view').value!=='all');updateStatus();}
$('play').onclick=()=>{if(running){pause();return;}if(selected().every(p=>p.cursor===p.frames.length-1)){selected().forEach(p=>{p.cursor=0;render(p);});}running=true;lastTime=performance.now();updateStatus();};
$('step').onclick=()=>{pause();advance();};$('reset').onclick=()=>rebuild(false);$('shuffle').onclick=()=>rebuild(true);$('count').onchange=()=>rebuild(true);$('view').onchange=()=>{pause();applyView();};$('speed').oninput=()=>{$('speedText').textContent=$('speed').value+' 档';document.documentElement.style.setProperty('--duration',Math.round(interval()*.8)+'ms');};
function tick(t){if(running&&t-lastTime>=interval()){lastTime=t;advance();}requestAnimationFrame(tick);}rebuild(true);$('speed').oninput();requestAnimationFrame(tick);
</script></body></html>
