<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · navi.x1shang.top</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="theme-color" content="#08080e" id="theme-color">
<script>
  /* 与导航页共用同一份主题偏好（hub.theme.v1），首帧前定好，避免闪白/闪黑 */
  (() => {
    const K = 'hub.theme.v1';
    let pref = 'system';
    try { const s = localStorage.getItem(K); if (s === 'light' || s === 'dark' || s === 'system') pref = s; } catch {}
    const theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
    document.documentElement.dataset.theme = theme;
    const meta = document.getElementById('theme-color');
    if (meta) meta.content = theme === 'dark' ? '#08080e' : '#f4f5f7';
  })();
</script>
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0a11;
    --fg:#ececf4;
    --dim:#9a9ab0;
    --link:#c9b6ff;
    --line:rgba(255,255,255,.12);
    --hover-line:rgba(201,182,255,.5);
    --title:linear-gradient(100deg,#ff6ec7,#a78bfa 55%,#67e8f9);
    --title-ink:transparent;
    --ctl-bg:rgba(255,255,255,.05);
  }
  /* 亮色与导航页同源：x1shang.top 首页的云底 #f4f5f7 + 右上白团，标题取超链接蓝 */
  html[data-theme="light"]{
    color-scheme:light;
    --bg:#f4f5f7;
    --fg:#28323a;
    --dim:#5a646c;
    --link:#2f6fb5;
    --line:rgba(120,130,140,.28);
    --hover-line:rgba(47,111,181,.5);
    --title:none;
    --title-ink:#2f6fb5;
    --ctl-bg:rgba(255,255,255,.58);
  }
  html,body{height:100%;margin:0}
  html{background:var(--bg)}
  body{
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--bg);color:var(--fg);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  html[data-theme="light"] body{
    background-color:var(--bg);
    background-image:radial-gradient(ellipse at 72% 30%,#ffffff,transparent 62%);
  }
  .box{text-align:center;max-width:520px}
  .code{
    font:700 clamp(56px,16vw,110px)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:var(--title);
    -webkit-background-clip:text;background-clip:text;color:var(--title-ink);
  }
  p{color:var(--dim);margin:14px 0 26px}
  a{color:var(--link);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 18px;display:inline-block;
    transition:border-color .15s}
  a:hover{border-color:var(--hover-line)}
  .ctl{position:fixed;top:16px;right:18px;display:inline-flex;align-items:center;justify-content:center;
       width:34px;height:34px;padding:0;color:var(--fg);background:var(--ctl-bg);border:1px solid var(--line);
       border-radius:99px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
       -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .ctl:hover{border-color:var(--hover-line);color:var(--link)}
  .ctl:focus-visible{outline:2px solid var(--hover-line);outline-offset:2px}
  .ctl svg{display:block;width:16px;height:16px}
  .ctl .i-moon{display:none}
  html[data-theme="light"] .ctl .i-sun{display:none}
  html[data-theme="light"] .ctl .i-moon{display:block}
  @media (max-width:520px){
    .ctl{top:12px;right:12px;width:30px;height:30px}
    .ctl svg{width:14px;height:14px}
  }
</style>
</head>
<body>
  <button class="ctl" id="theme" type="button" title="切换明暗主题" aria-label="切换明暗主题">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
    </svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.6 14.4A8.7 8.7 0 0 1 9.6 3.4a8.7 8.7 0 1 0 11 11Z"/>
    </svg>
  </button>

  <div class="box">
    <div class="code">404</div>
    <p>这条路还没修好，回首页看看吧。</p>
    <a href="/">返回首页</a>
  </div>

<script>
  (() => {
    'use strict';
    const K = 'hub.theme.v1';
    const sys = matchMedia('(prefers-color-scheme: dark)');
    const btn = document.getElementById('theme');
    const meta = document.getElementById('theme-color');
    let pref = 'system';
    try { const s = localStorage.getItem(K); if (s === 'light' || s === 'dark' || s === 'system') pref = s; } catch {}
    const now = () => (pref === 'system' ? (sys.matches ? 'dark' : 'light') : pref);
    function paint() {
      const t = now(), dark = t === 'dark';
      document.documentElement.dataset.theme = t;
      if (meta) meta.content = dark ? '#08080e' : '#f4f5f7';
      const label = dark ? '切换到浅色主题' : '切换到深色主题';
      btn.title = label + '（Shift 点击跟随系统）';
      btn.setAttribute('aria-label', label);
    }
    paint();
    sys.addEventListener('change', () => { if (pref === 'system') paint(); });
    btn.addEventListener('click', (e) => {
      pref = e.shiftKey ? 'system' : (document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      try { localStorage.setItem(K, pref); } catch {}
      paint();
    });
  })();
</script>
</body>
</html>
